services:
  - type: web
    name: skribbl-clone-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/skribbl-data
      - key: FRONTEND_URL
        sync: false
